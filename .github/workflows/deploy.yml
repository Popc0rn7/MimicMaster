name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts

          # Transfer files to server
          echo "Transferring files to server..."
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ $SERVER_USER@$SERVER_HOST:$SERVER_PATH

          # Restart service on server
          echo "Restarting service..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST << 'ENDSSH'
            cd $SERVER_PATH

            # Build and restart Docker container
            docker build -t mimic-master:latest .
            docker stop mimic-master || true
            docker rm mimic-master || true
            docker run -d \
              --name mimic-master \
              --restart unless-stopped \
              -p 8000:8000 \
              --env-file .env \
              mimic-master:latest
          ENDSSH

          echo "Deployment complete!"
