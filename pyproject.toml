[project]
name = "mimic-master"
version = "0.1.0"
description = "D&D 5E Dungeon Master AI Agent Assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.129.0",
    "pinecone>=6.0.0",
    "python-dotenv>=1.2.1",
    "langsmith>=0.3.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "uvicorn>=0.34.0",
    "numpy>=2.0.0",
    "motor>=3.6.0",
    "langchain>=1.2.10",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "openai>=2.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "black>=25.0.0",
    "ruff>=0.9.0",
]
